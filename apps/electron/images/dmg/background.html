<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 660px;
        height: 400px;
        overflow: hidden;
      }
      body {
        background: linear-gradient(180deg, #fbfcfd 0%, #eef1f5 100%);
        font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
        position: relative;
      }
      svg {
        position: absolute;
        left: 0;
        top: 0;
      }
      .hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 34px;
        text-align: center;
        color: #46546a;
        font-size: 14px;
        letter-spacing: 0.1px;
      }
      .hint b {
        color: #2f4058;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <svg width="660" height="400" viewBox="0 0 660 400">
      <defs>
        <marker
          id="head"
          viewBox="0 0 12 12"
          refX="8"
          refY="6"
          markerWidth="12"
          markerHeight="12"
          markerUnits="userSpaceOnUse"
          orient="auto"
        >
          <path
            d="M2 1.5 L 9 6 L 2 10.5"
            fill="none"
            stroke="#9aa6b8"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </marker>
      </defs>
      <path
        d="M256 182 C 300 146, 360 146, 400 178"
        fill="none"
        stroke="#9aa6b8"
        stroke-width="3"
        stroke-linecap="round"
        stroke-dasharray="2 9"
      />
      <path
        d="M399 177.2 L 404 181"
        fill="none"
        stroke="#9aa6b8"
        stroke-width="3"
        stroke-linecap="round"
        marker-end="url(#head)"
      />
    </svg>
    <div class="hint">
      Drag <b>DocNinja</b> into <b>Applications</b> to install
    </div>
    <script>
      document.documentElement.style.zoom = location.hash.slice(1) || 1;
    </script>
  </body>
</html>
